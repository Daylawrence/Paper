name: Rebuild GaussianDWM offline KaTeX, PDF brief and ZIP with checks
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finish-gaussiandwm.yml"
      - "scripts/finish_gaussiandwm_pack.py"
      - "reading-packs/2026-10-28_CVPR2026_GaussianDWM/app.js"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gaussian-pack-finishing
  cancel-in-progress: true
jobs:
  rebuild-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install content and browser audit libraries (reuse runner Chrome)
        run: |
          timeout 180s python -m pip install --quiet pymupdf beautifulsoup4 weasyprint playwright
          timeout 90s sudo apt-get install -y -qq fonts-noto-cjk || echo 'CJK apt timed out; continue with installed fonts'
          command -v google-chrome || command -v chromium || command -v chromium-browser || true
      - name: Build synchronized PDF, repair local rendering and check assets
        run: python scripts/finish_gaussiandwm_pack.py
      - name: Publish content, manifests and audit without claiming completed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reading-packs/2026-10-28_CVPR2026_GaussianDWM reading-packs/catalog.json reading-packs/repair-queue.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "repair(GaussianDWM): rebuild offline math, brief PDF and backup with checks [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
