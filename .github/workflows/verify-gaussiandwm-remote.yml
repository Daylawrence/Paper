name: Verify GaussianDWM remote full archive, PDF and 34 expanded files
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-gaussiandwm-remote.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remote-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet pymupdf pillow
      - name: Download from immutable remote commit and verify contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,pathlib,subprocess,zipfile,urllib.parse,urllib.request,io,re
          import fitz
          from PIL import Image
          root=pathlib.Path('.')
          d=root/'reading-packs/2026-10-28_CVPR2026_GaussianDWM'
          prefix='reading-packs/2026-10-28_CVPR2026_GaussianDWM/'
          zipname='2026-10-28_CVPR2026_GaussianDWM_阅读包.zip'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          req=urllib.request.Request('https://api.github.com/repos/Daylawrence/Paper/git/trees/'+head+'?recursive=1',headers={'User-Agent':'GaussianDWM-remote-audit'})
          with urllib.request.urlopen(req,timeout=100) as f:tree=json.loads(f.read())
          assert tree['sha']==head
          remote={f['path']:f for f in tree['tree'] if f['type']=='blob'}
          manifest=json.loads((d/'manifest.json').read_text(encoding='utf-8'))
          catalogpath=root/'reading-packs/catalog.json'
          catalog=json.loads(catalogpath.read_text(encoding='utf-8'))
          c=next(x for x in catalog if x.get('paper')=='GaussianDWM')
          assert len(manifest['files'])==34
          for rel,info in manifest['files'].items():
              e=remote.get(prefix+rel)
              assert e and e['size']==info['bytes'] and e['sha']==info['git_blob_sha'],rel
          assert remote[prefix+zipname]['size']==c['zip_bytes']
          assert remote[prefix+zipname]['sha']==c['zip_git_blob_sha']
          def sha(b):return hashlib.sha256(b).hexdigest()
          def blob(b):return hashlib.sha1(('blob '+str(len(b))+'\0').encode()+b).hexdigest()
          def raw(rel,out):
              u='https://raw.githubusercontent.com/Daylawrence/Paper/'+head+'/'+urllib.parse.quote(prefix+rel,safe='/')
              subprocess.run(['curl','-fL','--retry','3','--connect-timeout','20','--max-time','300',u,'-o',out],check=True)
              return pathlib.Path(out).read_bytes()
          zbytes=raw(zipname,'/tmp/gaussiandwm-remote.zip')
          assert len(zbytes)==c['zip_bytes'] and sha(zbytes)==c['zip_sha256']
          assert blob(zbytes)==c['zip_git_blob_sha']
          with zipfile.ZipFile(io.BytesIO(zbytes)) as z:
              assert z.testzip() is None
              dirname=zipname[:-4]+'/'
              expected={dirname+k for k in [*manifest['files'],'manifest.json']}
              assert set(z.namelist())==expected
              for rel,info in manifest['files'].items():
                  content=z.read(dirname+rel)
                  assert len(content)==info['bytes'] and sha(content)==info['sha256'] and blob(content)==info['git_blob_sha'],rel
              p18=z.read(dirname+'pages/page-18.jpg')
              p19=z.read(dirname+'pages/page-19.jpg')
              assert sha(p18)!=sha(p19)
              Image.open(io.BytesIO(p18)).verify()
              Image.open(io.BytesIO(p19)).verify()
          pbytes=raw('paper.pdf','/tmp/gaussiandwm-remote.pdf')
          assert len(pbytes)==c['source_pdf_bytes'] and sha(pbytes)==c['source_pdf_sha256']
          assert blob(pbytes)==c['source_pdf_git_blob_sha']
          doc=fitz.open(stream=pbytes,filetype='pdf')
          assert len(doc)==19
          last={str(i):len(doc[i-1].get_text('text').strip()) for i in (17,18,19)}
          assert min(last.values())>100,last
          html=(d/'index.html').read_text(encoding='utf-8')
          refs=set(re.findall(r'(?:src|href)="([^"]+)"',html))
          invalid=[]
          for ref in refs:
              if re.match(r'^(?:https?:|mailto:|data:|javascript:|#)',ref):continue
              rel=ref.split('#')[0].split('?')[0]
              if rel and not (d/rel).is_file():invalid.append(ref)
          assert not invalid,invalid
          audit={
            'paper':'GaussianDWM','verification_date':'2026-11-02',
            'remote_commit_checked':head,'default_branch':'main',
            'remote_git_tree_34_expanded_entries':'passed',
            'remote_zip':{'bytes':len(zbytes),'sha256':sha(zbytes),'git_blob_sha':blob(zbytes),'crc':'passed','manifest_entry_checks':34},
            'remote_paper_pdf':{'bytes':len(pbytes),'sha256':sha(pbytes),'git_blob_sha':blob(pbytes),'pages':19,'last_page_text_chars':last},
            'static_relative_asset_links':'passed','source_pages_restored':True,
            'full_chinese_translation':'not passed, original text substantially condensed',
            'delivery_status':'repairing','completed':False}
          (d/'remote-verification-2026-11-02.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          c['zip_remote_bytes_current_metadata']=len(zbytes)
          c['repair_status']='official_source_and_remote_verified_translation_pending'
          c['repair_last_checked_date']='2026-11-02'
          c['repair_audit_path']=prefix+'remote-verification-2026-11-02.json'
          c['delivery_status']='repairing'
          c['repair_note']='19 official pages restored; 34 remote Git blobs and full remote ZIP and PDF verified; full translation remains pending.'
          catalogpath.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          qpath=root/'reading-packs/repair-queue.json'
          queue=json.loads(qpath.read_text(encoding='utf-8'))
          first=next(x for x in queue['entries'] if x['paper']=='GaussianDWM')
          first['repair_status']='official_source_and_remote_verified_translation_pending'
          first['new_standard_completed']=False
          queue['updated_date']='2026-11-02'
          qpath.write_text(json.dumps(queue,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          source=d/'source-restoration-audit-2026-11-02.json'
          a=json.loads(source.read_text(encoding='utf-8'))
          a['remote_default_branch_validation']='passed, independent full ZIP and PDF redownload, 34 Git object checks'
          a['completed']=False
          source.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False))
          PY
      - name: Publish audit without changing repair completion status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading-packs/2026-10-28_CVPR2026_GaussianDWM/remote-verification-2026-11-02.json \
            reading-packs/2026-10-28_CVPR2026_GaussianDWM/source-restoration-audit-2026-11-02.json \
            reading-packs/catalog.json reading-packs/repair-queue.json
          git commit -m "Record independent GaussianDWM GitHub re-download integrity check [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
