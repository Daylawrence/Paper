name: GaussianDWM current remote full-content verification
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-gaussiandwm-remote.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gaussian-current-remote-verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --quiet pymupdf
      - name: Verify immutable remote blob tree, ZIP, PDF and references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess, urllib.request, urllib.parse, json, hashlib, zipfile, io, re
          import fitz
          root=pathlib.Path("reading-packs")
          d=root/"2026-10-28_CVPR2026_GaussianDWM"
          prefix=d.as_posix()+"/"
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree_sha=subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Paper-verified-remote/1.0"})
              with urllib.request.urlopen(req,timeout=120) as r:return r.read()
          tree=json.loads(get("https://api.github.com/repos/Daylawrence/Paper/git/trees/"+tree_sha+"?recursive=1"))
          assert not tree.get("truncated"),"Git remote tree truncated"
          assert tree["sha"]==tree_sha,(tree["sha"],tree_sha)
          objects={x["path"]:x for x in tree["tree"] if x["type"]=="blob"}
          manifest=json.loads((d/"manifest.json").read_text("utf-8"))
          files=manifest["files"]
          assert len(files)>=35,f"Unexpectedly sparse manifest: {len(files)}"
          for path,meta in files.items():
              o=objects.get(prefix+path)
              assert o and o["sha"]==meta["git_blob_sha"] and o["size"]==meta["bytes"],path
              content=(d/path).read_bytes()
              assert len(content)==meta["bytes"],path
              assert hashlib.sha256(content).hexdigest()==meta["sha256"],path
          def raw(rel):
              url="https://raw.githubusercontent.com/Daylawrence/Paper/"+head+"/"+urllib.parse.quote(prefix+rel,safe="/")
              return get(url)
          def sha256(b):return hashlib.sha256(b).hexdigest()
          def blob(b):return hashlib.sha1(b"blob "+str(len(b)).encode()+bytes([0])+b).hexdigest()
          catalog=json.loads((root/"catalog.json").read_text("utf-8"))
          c=next(x for x in catalog if x.get("paper")=="GaussianDWM")
          zipname="2026-10-28_CVPR2026_GaussianDWM_阅读包.zip"
          zbytes=raw(zipname)
          assert len(zbytes)==c["zip_bytes"] and sha256(zbytes)==c["zip_sha256"] and blob(zbytes)==c["zip_git_blob_sha"],{"downloaded_bytes":len(zbytes),"expected_bytes":c["zip_bytes"],"downloaded_sha256":sha256(zbytes),"expected_sha256":c["zip_sha256"],"downloaded_blob":blob(zbytes),"expected_blob":c["zip_git_blob_sha"]}
          zipnames=set()
          dirname=zipname[:-4]+"/"
          with zipfile.ZipFile(io.BytesIO(zbytes)) as z:
              assert z.testzip() is None,"ZIP CRC validation failed"
              zipnames=set(z.namelist())
              expect={dirname+x for x in files}|{dirname+"manifest.json"}
              assert zipnames==expect,f"ZIP discrepancy: extra {len(zipnames-expect)}, missing {len(expect-zipnames)}"
              for rel,m in files.items():
                  data=z.read(dirname+rel)
                  assert len(data)==m["bytes"] and sha256(data)==m["sha256"] and blob(data)==m["git_blob_sha"],rel
              assert z.read(dirname+"manifest.json")== (d/"manifest.json").read_bytes()
          pdf=raw("paper.pdf")
          assert len(pdf)==c["source_pdf_bytes"] and sha256(pdf)==c["source_pdf_sha256"] and blob(pdf)==c["source_pdf_git_blob_sha"]
          paper=fitz.open(stream=pdf,filetype="pdf")
          assert len(paper)==19,len(paper)
          briefs=[x for x in files if x.endswith("_中文学习简报.pdf")]
          assert len(briefs)==1,briefs
          brief=raw(briefs[0])
          m=files[briefs[0]]
          assert len(brief)==m["bytes"] and sha256(brief)==m["sha256"] and blob(brief)==m["git_blob_sha"]
          briefpages=len(fitz.open(stream=brief,filetype="pdf"))
          for file in ["index.html","translation.html","algorithms.html","coverage.html"]:
              html=(d/file).read_text("utf-8")
              for link in re.findall(r'(?:src|href)="([^"]+)"',html):
                  if re.match(r"^(?:https?:|mailto:|data:|#|javascript:)",link):continue
                  local=urllib.parse.unquote(link.split("?")[0].split("#")[0])
                  assert local and (d/local).is_file(),(file,link)
          from pathlib import PurePosixPath
          result={
              "paper":"GaussianDWM","source_created_date":"2026-10-28","verification_date":"2026-11-07",
              "verified_immutable_remote_commit":head,"checked_tree_sha":tree_sha,
              "expanded_payload_files":len(files),"expanded_blob_sha_size_and_sha256":"passed",
              "remote_zip":{"bytes":len(zbytes),"sha256":sha256(zbytes),"crc":"passed","entries":len(zipnames)},
              "remote_paper_pdf":{"bytes":len(pdf),"sha256":sha256(pdf),"pages":len(paper)},
              "remote_brief_pdf":{"bytes":len(brief),"sha256":sha256(brief),"pages":briefpages},
              "relative_html_resources":"passed","translation_full_paragraph_quality":"not yet certified",
              "delivery_status":"repairing","new_standard_completed":False
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          out=root/"audits"/"gaussiandwm-remote-2026-11-07.json"
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          PY
      - name: Commit independent remote audit without changing completion state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading-packs/audits/gaussiandwm-remote-2026-11-07.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(GaussianDWM): immutable remote ZIP, PDF and expanded file integrity [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
