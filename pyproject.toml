[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-gui"
version = "0.1.0"
description = "Desktop GUI MVP for a single-robot factory pickup and delivery demo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pyinstaller>=6.0,<7",
]

[project.scripts]
factory-gui = "factory_gui.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
